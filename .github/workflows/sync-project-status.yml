name: sync-project-status

# Keeps the Kite Compass Project V2 board's Status field in sync with the
# `status:*` labels on issues. The issue-driven pipeline (.opencode agents)
# flips `status:*` labels as the single source of truth; this workflow mirrors
# those changes onto the board so the human dashboard never goes stale.
#
# NOTE: Projects V2 requires the `project` scope, which the built-in
# GITHUB_TOKEN does not have. The workflow therefore uses the
# PROJECT_SYNC_TOKEN repository secret (a classic PAT with `project` scope,
# or a fine-grained token with Projects: Read and write).
#
# Project config (update here if the board/field is recreated):
#   PROJECT_ID       = PVT_kwHOAdW04c4Bfm8W
#   STATUS_FIELD_ID  = PVTSSF_lAHOAdW04c4Bfm8WzhZ4oyU

on:
  issues:
    types: [labeled, unlabeled, edited, opened, reopened]

permissions:
  issues: read

jobs:
  sync-status:
    runs-on: ubuntu-latest
    if: >-
      github.event.issue != null &&
      (github.event.action == 'labeled' ||
       github.event.action == 'unlabeled' ||
       github.event.action == 'edited' ||
       github.event.action == 'opened' ||
       github.event.action == 'reopened')
    steps:
      - name: Sync status label to project board
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_SYNC_TOKEN }}
          script: |
            const projectId = "PVT_kwHOAdW04c4Bfm8W";
            const statusFieldId = "PVTSSF_lAHOAdW04c4Bfm8WzhZ4oyU";

            // status:* label -> Status field option id (must match the board field options)
            const statusToOptionId = {
              "status:needs-planner": "0058a0ed",
              "status:planner-working": "88a29539",
              "status:blocked": "a953b8d1",
              "status:needs-implementer": "a68f2a81",
              "status:implementer-working": "efed5ebe",
              "status:needs-review": "8ce02b69",
              "status:done": "f6bc307e",
            };

            const issue = context.payload.issue;
            const issueNodeId = issue.node_id;
            const labelNames = (issue.labels || []).map((l) => l.name);
            const statusLabel = labelNames.find((n) => statusToOptionId[n]);

            if (!statusLabel) {
              console.log(`Issue #${issue.number}: no status:* label present, nothing to sync.`);
              return;
            }
            const optionId = statusToOptionId[statusLabel];

            // Find the project item linked to this issue (paged scan).
            let itemId = null;
            let cursor = null;
            do {
              const q = `query($after: String) {
                node(id: "${projectId}") {
                  ... on ProjectV2 {
                    items(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content { ... on Issue { id } }
                      }
                    }
                  }
                }
              }`;
              const res = await github.graphql(q, { after: cursor });
              const page = res.node.items;
              const hit = page.nodes.find((n) => n.content && n.content.id === issueNodeId);
              if (hit) { itemId = hit.id; break; }
              cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
            } while (cursor);

            if (!itemId) {
              console.log(`Issue #${issue.number}: not on the project board, adding it first.`);
              const addRes = await github.graphql(`mutation {
                addProjectV2ItemById(input: { projectId: "${projectId}", contentId: "${issueNodeId}" }) {
                  item { id }
                }
              }`);
              itemId = addRes.addProjectV2ItemById.item.id;
            }

            await github.graphql(`mutation {
              updateProjectV2ItemFieldValue(input: {
                projectId: "${projectId}",
                itemId: "${itemId}",
                fieldId: "${statusFieldId}",
                value: { singleSelectOptionId: "${optionId}" }
              }) { projectV2Item { id } }
            }`);

            console.log(`Issue #${issue.number}: synced board status -> ${statusLabel}`);
