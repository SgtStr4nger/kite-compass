name: mark-done-on-merge

# When a PR merges, mark the issue(s) it references as done: flip the status
# label to `status:done`, replace any other `status:*`, and close the issue.
# The sync-project-status workflow then moves the board lane via the resulting
# `closed`/`labeled` events. This covers the case where a human reviews and
# merges the PR directly, without waiting for the planner's review step.

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  mark-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Mark referenced issue done and close
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const title = pr.title || "";
            const branch = pr.head && pr.head.ref ? pr.head.ref : "";

            // Find the referenced issue number, in order of reliability:
            // 1. "closes #N" / "fixes #N" style keywords in the PR body
            // 2. the pipeline branch name `feat/{N}-{slug}`
            // 3. "#N" in the PR title
            // 4. any "#N" in the PR body
            const keyword = (body.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#?(\d+)/i) || [])[1];
            const branchNum = (branch.match(/(?:^|\/)[a-z0-9-]*?[_-]?(\d+)(?:-|$)/i) || [])[1];
            const titleNum = (title.match(/#(\d+)/) || [])[1];
            const bodyNum = (body.match(/#(\d+)/) || [])[1];

            const issueNumber = parseInt(keyword || branchNum || titleNum || bodyNum, 10);
            if (!issueNumber || Number.isNaN(issueNumber)) {
              console.log(`PR #${pr.number} merged, but no referenced issue number found — skipping.`);
              console.log(`  body keywords: ${keyword || "none"}, branch: ${branch}, title #N: ${titleNum || "none"}, body #N: ${bodyNum || "none"}`);
              return;
            }
            console.log(`PR #${pr.number} merged, referencing issue #${issueNumber}.`);

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (issue.pull_request) {
              console.log(`#${issueNumber} is a pull request, not an issue — skipping.`);
              return;
            }

            const kept = (issue.labels || []).map((l) => l.name).filter((n) => !n.startsWith("status:"));
            const newLabels = [...kept, "status:done"];

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: newLabels,
              state: "closed",
            });
            console.log(`Issue #${issueNumber}: set status:done and closed.`);
